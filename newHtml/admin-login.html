<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusixVest — Admin Log In</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#071342] text-slate-800 antialiased min-h-screen flex items-center justify-center px-4">
<a href="#main" class="skip-link">Skip to main content</a>

<main id="main" class="w-full max-w-sm">
  <div class="text-center mb-6">
    <a href="index.html" class="inline-block">
      <img src="assets/img/logo.png" alt="MusixVest home" class="h-9 w-auto object-contain mx-auto brightness-0 invert">
    </a>
    <p class="text-blue-200 text-xs font-semibold uppercase tracking-widest mt-4">Admin Portal</p>
  </div>

  <div class="card bg-white p-7">
    <h1 class="text-xl font-extrabold text-slate-900 mb-1">Admin log in</h1>
    <p class="text-xs text-slate-500 mb-6">Review deposits and manage the platform.</p>

    <div id="form-alert" class="alert alert-danger hidden mb-4" role="alert"></div>

    <form id="admin-login-form" novalidate class="space-y-4">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" class="input" placeholder="admin@musixvest.com">
        <p class="field-error" id="email-error">Enter your admin email.</p>
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" class="input" placeholder="Enter your password">
        <p class="field-error" id="password-error">Enter your password.</p>
      </div>
      <button type="submit" class="btn btn-primary w-full">Log In</button>
    </form>

    <p class="text-xs text-slate-400 mt-5 pt-4 border-t border-slate-100 leading-relaxed">
      Sign in with your administrator credentials to manage investor activity.
    </p>
  </div>

  <p class="text-center mt-5">
    <a href="index.html" class="text-blue-200 text-xs hover:text-white">← Back to website</a>
  </p>
</main>

</body>
</html>
