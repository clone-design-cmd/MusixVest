<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongTrade - Login</title>
    <link rel="icon" type="image/png" href="image.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 antialiased min-h-screen relative">

    <div class="min-h-screen grid grid-cols-1 lg:grid-cols-12">
        
        <!-- LEFT HERO BANNER -->
        <div class="lg:col-span-4 bg-[#2D60C3] text-white p-8 sm:p-12 lg:p-12 flex flex-col justify-between relative overflow-hidden min-h-[400px] lg:min-h-screen">
            <!-- Background Image with Overlay -->
            <div class="absolute inset-0 z-0 opacity-40 mix-blend-multiply bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1000&auto=format&fit=crop');"></div>

            <div class="relative z-10">
                <!-- Brand Logo -->
                <a href="login.html" class="inline-block mb-12">
                    <img src="logo.png" alt="SongTrade" class="h-8 w-auto object-contain">
                </a>

                <!-- As Seen In Section -->
                <div class="space-y-6 mt-8">
                    <p class="text-xs uppercase tracking-widest font-semibold text-blue-200">As seen in</p>
                    
                    <div class="flex flex-col space-y-5 text-white/90 font-bold text-lg sm:text-xl tracking-tight">
                        <span class="font-extrabold italic tracking-normal">billboard</span>
                        <span class="font-semibold tracking-wide">music:)ally</span>
                        <span class="text-sm tracking-wider uppercase font-black">MUSICBUSINESS<br><span class="font-normal text-xs tracking-widest">WORLDWIDE</span></span>
                        <span class="font-serif font-extrabold tracking-normal">BARRON'S</span>
                        <span class="font-extrabold tracking-tighter uppercase text-base">THE VERGE</span>
                        <span class="font-semibold tracking-tight">Bankrate</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT FORM SECTION -->
        <div class="lg:col-span-8 p-8 sm:p-12 lg:p-16 flex flex-col justify-between items-center relative">
            
            <!-- Top Right Register Navigation -->
            <div class="w-full flex justify-end text-xs sm:text-sm">
                <span class="text-slate-600 font-medium">Don't have an account? </span>
                <a href="register.html" class="text-[#2D60C3] font-bold ml-1 hover:underline">Register</a>
            </div>

            <!-- Login Form Container -->
            <div class="w-full max-w-md my-auto py-8 space-y-6">
                
                <h1 class="text-3xl font-extrabold text-slate-900">Login</h1>

                <form action="dashboard.html" method="GET" class="space-y-5">
                    
                    <!-- Email Address Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Email</label>
                        <input type="email" placeholder="Enter your email address" class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-red-50/20 text-sm focus:outline-none focus:border-[#2D60C3] focus:ring-1 focus:ring-[#2D60C3] transition-colors placeholder:text-slate-400">
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Password</label>
                        <div class="relative">
                            <input type="password" placeholder="Enter your password" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-[#2D60C3] focus:ring-1 focus:ring-[#2D60C3] transition-colors pr-10 placeholder:text-slate-400">
                            <button type="button" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-700 hover:text-slate-900">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between pt-1">
                        <label class="flex items-center gap-2 cursor-pointer text-xs font-semibold text-slate-700">
                            <input type="checkbox" class="h-4 w-4 rounded border-slate-300 text-[#2D60C3] focus:ring-[#2D60C3]">
                            <span>Remember me</span>
                        </label>
                        <a href="register.html" class="text-xs font-bold text-[#2D60C3] hover:underline">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <div class="pt-2">
                        <button type="submit" class="w-full sm:w-auto bg-[#2D60C3] hover:bg-[#234DA0] text-white font-bold text-xs uppercase tracking-wider px-10 py-3 rounded-xl shadow-sm transition-all cursor-pointer">
                            LOGIN
                        </button>
                    </div>

                </form>
            </div>

            <!-- Empty Div to maintain layout alignment on desktop -->
            <div class="hidden lg:block"></div>

        </div>

    </div>

    <!-- Contact Us Floating Button -->
    <a href="index.html" class="fixed bottom-6 right-6 bg-[#003B73] hover:bg-[#002d58] text-white font-semibold text-xs px-5 py-3 rounded-xl shadow-lg transition-all flex items-center gap-2">
        Contact Us
    </a>

</body>
</html>
